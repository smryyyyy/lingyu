[package]
name = "lingyu"
version = "0.1.0"
description = "浮窗一键语音转文字（STT）桌面应用"
edition = "2021"

[dependencies]
gtk4 = "0.9"
gdk4 = "0.9"
gdk-pixbuf = "0.20"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
arboard = "3"
dotenvy = "0.15"
flate2 = "1"
tar = "0.4"
zip = "2"

[dev-dependencies]
tempfile = "3"
